<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>DASHBOARD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            margin: 30px 0 10px;
            color: #222;
        }

        .container {
            width: 80%;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 0 5px rgba(0,0,0,0.05);
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #eaeaea;
            padding: 10px;
            text-align: left;
            cursor: pointer;
            font-weight: normal;
            border-bottom: 2px solid #ccc;
        }

        th:hover {
            background-color: #dcdcdc;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        tbody tr:nth-child(even) {
            background-color: #fafafa;
        }

        tbody tr:nth-child(odd) {
            background-color: #ffffff;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .no-data {
            text-align: center;
            color: #777;
            padding: 15px;
        }
    </style>
</head>
<body>
<h1>Utenti</h1>
<div class="container">
    <input type="text" id="searchInput" placeholder="Cerca...">
    <table id="userTable">
        <thead>
        <tr id="tableHeader"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    <div id="noData" class="no-data" style="display:none;">No data Found</div>
</div>

<script>
    let originalData = [];

    fetch('/user/get-all')
        .then(response => response.json())
        .then(data => {
            if (!Array.isArray(data) || data.length === 0) return;
            originalData = data;
            buildTable(data);
        })
        .catch(error => {
            console.error('Error during loading data:', error);
        });

    function buildTable(data) {
        const tableHeader = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');
        const noDataDiv = document.getElementById('noData');

        tableHeader.innerHTML = '';
        tableBody.innerHTML = '';

        const keys = Object.keys(data[0]);

        keys.forEach(key => {
            const th = document.createElement('th');
            th.textContent = key;
            th.addEventListener('click', () => sortByColumn(key));
            tableHeader.appendChild(th);
        });

        data.forEach(item => {
            const row = document.createElement('tr');
            keys.forEach(key => {
                const td = document.createElement('td');
                td.textContent = item[key];
                row.appendChild(td);
            });
            tableBody.appendChild(row);
        });

        noDataDiv.style.display = data.length === 0 ? 'block' : 'none';
    }

    function sortByColumn(column) {
        const sorted = [...originalData].sort((a, b) => {
            if (typeof a[column] === 'number') return a[column] - b[column];
            return String(a[column]).localeCompare(String(b[column]));
        });
        buildTable(sorted);
    }

    document.getElementById('searchInput').addEventListener('input', function () {
        const value = this.value.toLowerCase();
        const filtered = originalData.filter(row =>
            Object.values(row).some(val =>
                String(val).toLowerCase().includes(value)
            )
        );
        buildTable(filtered);
    });
</script>
</body>
</html>
